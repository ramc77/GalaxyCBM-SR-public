[project]
name = "galaxycbm"
version = "0.0.1"
description = "GalaxyCBM-SR — glass-box galaxy morphology classifier (Concept Bottleneck + Symbolic head + Conformal wrapper)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "GalaxyCBM-SR authors" }]

# Version choices are logged with each run in results/<stage>/run.json.
#
# Notes on the compatibility matrix (checked against PyPI, not memory):
#   - zoobot 2.9.x requires torch>=2.7. torch >= 2.3 dropped macOS x86_64
#     wheels; the last x86_64-macOS release was 2.2.2. To keep the base
#     install runnable on every platform we develop on (Linux/aarch64 GPU
#     boxes AND Intel Macs used for CI / scaffolding), torch + zoobot live
#     in the `stage1` extra. Install with:
#         uv sync --extra dev                       # scaffold / P0
#         uv sync --extra dev --extra stage1        # any modelling stage
#   - pysr 1.5.10 pins juliacall>=0.9.24,<0.9.27 and, via its bundled
#     juliapkg.json, requests Julia in {1.10.0} ∪ [1.10.3, 1.11).
#     juliapkg auto-installs a matching Julia into the venv on first import,
#     so we deliberately do NOT rely on a system Julia (brew currently ships
#     1.12, which is outside PySR's supported range).
#   - MAPIE picked over crepes/torchcp for conformal:
#       * MAPIE is a scikit-learn-contrib package with first-class
#         classification prediction sets (MapieClassifier /
#         SplitConformalClassifier). Our Stage-2 symbolic head is
#         sklearn-compatible, so MAPIE composes cleanly.
#       * torchcp is PyTorch-native — no advantage for a symbolic classifier.
#       * crepes started regression-first; MAPIE has the more mature
#         classification API and the wider community.
dependencies = [
    "statmorph>=0.7.2,<0.8",
    "astropy>=6.1,<8.0",
    "photutils>=2.0,<3.0",
    "scikit-image>=0.25.2,<0.26",
    "pysr>=1.5.10,<2.0",
    "mapie>=1.4.0,<2.0",
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=17.0,<21.0",
    "pyyaml>=6.0,<7.0",
    "matplotlib>=3.9,<4.0",
    "hydra-core>=1.3,<2.0",   # config loading (Hydra chosen over bare PyYAML for composition + CLI overrides).
    "omegaconf>=2.3,<3.0",
    "tqdm>=4.66,<5.0",
    "huggingface-hub>=1.22.0",
]

[project.optional-dependencies]
# Heavy Stage-1 deps kept out of the base install because torch>=2.3 has no
# macOS x86_64 wheels. Every real training run uses `--extra stage1`.
stage1 = [
    "torch>=2.7,<2.12",
    "zoobot[pytorch]>=2.9.0,<3.0",
]
# P7 baselines pull in shap + xgboost. shap → numba; uv otherwise walks back
# to numba 0.47 (2020, distutils-broken) when a modern wheel isn't obviously
# reachable. Pinning numba explicitly forces the resolver to a supported
# minor with real macOS-arm64 / linux wheels.
baselines = [
    "xgboost>=2.1,<3.0",
    "shap>=0.46,<1.0",
    "numba>=0.60,<0.62",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galaxycbm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "julia: tests that require Julia + PySR (slow on first run — juliapkg downloads Julia).",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv]
# Pin the Python interpreter uv will fetch/build the venv with.
python-preference = "managed"
